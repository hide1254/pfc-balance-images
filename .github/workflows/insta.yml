# Instagram 自動投稿（@pfc_balance2026）
# ふだんは Google Apps Script（目覚まし時計）が10分ごとに tick を呼ぶ。
# GitHub 自身の時刻実行（15分ごと）は予備。遅れたり抜けたりしても、tick は「今やるべきこと」だけを行う。
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 予備：15分ごと（混雑する0分を避ける）
  repository_dispatch:
    types: [run]                    # Claude が Mac から動かす用（mode を client_payload で渡す）
  workflow_dispatch:
    inputs:
      mode:
        description: "tick / notify / post / refresh / test / testcheck"
        required: true
        default: tick

permissions:
  contents: write
  issues: write

concurrency:
  group: insta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 準備
        run: pip install pynacl==1.5.0
      - name: 実行
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: hide1254
        run: python scripts/insta_gh.py ${{ github.event.inputs.mode || github.event.client_payload.mode || 'tick' }}
